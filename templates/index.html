<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loki Assistant</title>
  <link rel="icon" href="/static/mascot.png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="header glass">
    <div class="logo-wrap">
      <img class="mascot mascot-logo" src="/static/mascot.png" alt="Loki mascot">
      <div class="logo-glow"></div>
    </div>
    <div class="title">
      <h1>Loki<span class="accent">.</span></h1>
      <p>Your personal AI assistant</p>
    </div>
    <button id="clear-btn" class="icon-btn" title="Clear chat" aria-label="Clear chat">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M4 7h16M10 4h4l1 3H9l1-3zM6 7l1 13h10l1-13M10 11v6M14 11v6"/>
      </svg>
    </button>
    <div class="status-pill" id="status-pill">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Idle</span>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="controls">
    <div class="chips" id="chips">
      <button class="chip" data-command="open youtube">YouTube</button>
      <button class="chip" data-command="open github">GitHub</button>
      <button class="chip" data-command="news">News</button>
      <button class="chip" data-command="what is python">What is Python?</button>
      <button class="chip" data-command="play wolf">Play Wolf</button>
      <button class="chip" data-command="time">Time</button>
    </div>
    <div class="input-row glass">
      <button id="mic-btn" class="mic-btn" title="Speak a command" aria-label="Speak a command">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M17.3 11a.9.9 0 0 0-1.8 0 3.5 3.5 0 0 1-7 0 .9.9 0 0 0-1.8 0 5.3 5.3 0 0 0 4.4 5.2V19a.9.9 0 1 0 1.8 0v-2.8a5.3 5.3 0 0 0 4.4-5.2z"/>
        </svg>
        <span class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
      </button>
      <input id="text-input" type="text" placeholder='Try "open youtube", "what is python", "news"...' autocomplete="off">
      <button id="sound-btn" class="sound-btn" title="Toggle voice replies" aria-label="Toggle voice replies" aria-pressed="true">
        <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
          <path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
          <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3.4 20.4 21.9 12 3.4 3.6l-.03 6.5 13.2 1.9-13.2 1.9-.03 6.5z"/>
        </svg>
      </button>
    </div>
    <div class="hint" id="hint">Press the mic and speak, or type a command</div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
